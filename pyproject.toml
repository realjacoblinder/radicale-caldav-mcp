[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "radicale-mcp"
version = "0.4.0"
description = "A small, single-identity CalDAV/VTODO MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=2.2,<3",
  "caldav>=3.3,<4",
  "icalendar>=7.3,<8",
  "recurring-ical-events>=3.8.2,<4",
  "niquests>=3.21,<4",
  "tzdata>=2026.2",
  "python-dateutil>=2.9,<3",
]

[project.scripts]
radicale-mcp = "radicale_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "radicale>=3.8,<4", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "build>=1.4,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: starts a real local Radicale subprocess"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["caldav.*", "icalendar.*", "recurring_ical_events.*", "niquests.*", "dateutil.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
  "/.env.example",
]

[tool.hatch.build.targets.wheel]
packages = ["src/radicale_mcp"]
