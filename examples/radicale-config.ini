# Merge with the installed Radicale configuration; preserve distro service settings.
# Intended for Radicale 3.x, behind nginx on the same machine.
[server]
hosts = 127.0.0.1:5232

[auth]
type = htpasswd
htpasswd_filename = /etc/radicale/users
htpasswd_encryption = bcrypt

[rights]
type = owner_only

[storage]
filesystem_folder = /var/lib/radicale/collections

[logging]
level = warning
